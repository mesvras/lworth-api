[project]
name = "lworth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "angelo-rbs", email = "angeloraphael1@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
]

[project.scripts]
lworth = "lworth:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src/lworth"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
